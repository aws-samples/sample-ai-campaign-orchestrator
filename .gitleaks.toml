[allowlist]
description = "Allowlist for known false positives in synthetic demo data"

# The Square access token rule matches UUIDs that happen to contain 'eaaa'
# in the synthetic customer_profiles.json demo dataset. These are random UUIDs
# generated by Faker and contain no real credentials.
[[allowlist.rules]]
id = "square-access-token"
paths = [
    "data/demo/customer_profiles.json",
    "data/travel/customer_profiles.json",
]
